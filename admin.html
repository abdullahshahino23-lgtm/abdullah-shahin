<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="logo.png">
<title>لوحة تحكم الكاتب</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c0a;--card:#171410;--gold:#d4b062;--gold2:#e8cd8c;--ink:#efe8d8;--mut:#a89f8b;--bd:rgba(212,176,98,.22);--glow:rgba(212,176,98,.12);--on:#14110a}
@media (prefers-color-scheme:light){:root{--bg:#f7f2e7;--card:#fffaf0;--gold:#8a6420;--gold2:#6e4f14;--ink:#2a2418;--mut:#6b6150;--bd:rgba(138,100,32,.25);--glow:rgba(138,100,32,.1);--on:#fffaf0}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;padding:1.2rem}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:'Amiri',serif;color:var(--gold);font-size:2rem;display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
h1 img{height:44px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1.4rem;margin-bottom:1rem}
.fg{margin-bottom:1rem}.fg label{display:block;font-size:.9rem;color:var(--mut);margin-bottom:.3rem}
input,textarea,select{width:100%;padding:.75rem 1rem;background:var(--bg);border:1px solid var(--bd);border-radius:10px;color:var(--ink);font:400 1rem 'Tajawal',sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.4rem;border-radius:10px;border:1px solid var(--gold);cursor:pointer;font:500 1rem 'Tajawal',sans-serif;text-decoration:none;background:transparent;color:var(--gold)}
.bp{background:var(--gold);color:var(--on)}.full{width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;border:1px solid var(--bd);border-radius:12px;padding:.6rem .9rem;margin-bottom:.6rem}
.row img{width:38px;height:38px;object-fit:cover;border-radius:6px}
.row div{display:flex;gap:.4rem;align-items:center}
.ib{background:var(--glow);border:1px solid var(--bd);color:var(--gold);border-radius:8px;padding:.35rem .8rem;cursor:pointer;font:400 .9rem 'Tajawal',sans-serif}
.top{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
small{color:var(--mut)}
details{margin-top:1rem}summary{color:var(--gold);cursor:pointer;margin-bottom:.8rem}
#prev{max-width:130px;border-radius:8px;margin-top:.5rem;display:none}
#toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--gold);color:var(--on);padding:.6rem 1.3rem;border-radius:30px;display:none;z-index:9;font-weight:500;max-width:90vw;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1><img src="logo.png" alt="">لوحة تحكم الكاتب</h1>

<div id="login" class="box">
  <p style="margin-bottom:1rem">أول دخول: أدخل مفتاح GitHub (Token) مرة واحدة، وهيتحفظ على جهازك فقط.</p>
  <div class="fg"><label>مفتاح GitHub (Token)</label><input id="tk" type="password" dir="ltr" autocomplete="off"></div>
  <div class="fg"><label>اسم حساب GitHub</label><input id="ow" dir="ltr"></div>
  <div class="fg"><label>اسم الريبو (المستودع)</label><input id="rp" dir="ltr"></div>
  <div class="fg"><label>الفرع</label><input id="br" dir="ltr" value="main"></div>
  <button class="btn bp full" id="go">حفظ ودخول</button>
</div>

<div id="panel" hidden>
  <div class="top">
    <a class="btn" href="./" target="_blank">عرض الموقع</a>
    <button class="btn" id="add">+ عمل جديد</button>
    <button class="btn" id="out">تسجيل خروج</button>
  </div>
  <div class="box"><div id="list"></div></div>

  <form id="wf" class="box" hidden>
    <div class="fg"><label>النوع</label><select id="f_type"><option value="novel">رواية</option><option value="story">مجموعة قصصية</option><option value="article">مقال أدبي</option></select></div>
    <div class="fg"><label>العنوان</label><input id="f_title" required></div>
    <div class="fg"><label>نبذة قصيرة</label><textarea id="f_desc" rows="3"></textarea></div>
    <div class="fg"><label>مقتطف للقراءة (اختياري)</label><textarea id="f_ex" rows="4"></textarea></div>
    <div class="fg"><label>السعر (مثال: 50 ريال)</label><input id="f_price"></div>
    <div class="fg"><label>الحالة</label><select id="f_st"><option value="on">متاح للشراء</option><option value="soon">قريباً (بدون زر شراء)</option></select></div>
    <div class="fg"><label>صورة الغلاف</label><input type="file" id="f_file" accept="image/*"><img id="prev" alt=""><button type="button" class="ib" id="rmc" hidden style="margin-top:.5rem">حذف الغلاف</button></div>
    <div class="fg"><label>ملف PDF (اختياري)</label><input type="file" id="f_pdf" accept="application/pdf"><div id="pdfcur" style="margin-top:.5rem"></div><button type="button" class="ib" id="rmp" hidden style="margin-top:.5rem">حذف ملف PDF</button></div>
    <button class="btn bp full" id="sv">حفظ ونشر</button>
  </form>

  <details class="box"><summary>إعدادات الموقع</summary>
    <form id="sf">
      <div class="fg"><label>رقم واتساب لاستقبال الطلبات (بالصيغة الدولية)</label><input id="s_wa" dir="ltr" required></div>
      <div class="fg"><label>نبذة الكاتب (كل سطر فقرة)</label><textarea id="s_bio" rows="4"></textarea></div>
      <div class="fg"><label>المقتبس</label><textarea id="s_q" rows="2"></textarea></div>
      <button class="btn bp full">حفظ الإعدادات</button>
    </form>
  </details>
  <small>بعد كل حفظ، الموقع بيتحدث خلال دقيقة تقريباً.</small>
</div>
</div>
<div id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
var C={},D=null,SHA=null,editing=null,cover='',pdf='',pend=null,busy=false,tt,up=0;
try{C=JSON.parse(localStorage.getItem('gh')||'{}')}catch(e){}
if(!C.owner&&/\.github\.io$/.test(location.hostname)){C.owner=location.hostname.split('.')[0];C.repo=location.pathname.split('/')[1]||location.hostname}
function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML.replace(/"/g,'&quot;')}
function toast(m,long){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(function(){t.style.display='none'},long?7000:3500)}
function b64(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function unb64(x){var s=atob(x.replace(/\n/g,'')),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
function api(path,method,body){
 var url='https://api.github.com/repos/'+C.owner+'/'+C.repo+'/contents/'+path+(method?'':'?ref='+encodeURIComponent(C.branch)+'&_='+Date.now());
 return fetch(url,{method:method||'GET',headers:{'Authorization':'Bearer '+C.token,'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined})}
function load(){
 return api('works.json').then(function(r){
  if(r.status===401||r.status===403){throw new Error('المفتاح غير صالح أو ليس له صلاحية على هذا الريبو')}
  if(r.status===404){throw new Error('لم يتم العثور على works.json، راجع اسم الحساب والريبو والفرع')}
  if(!r.ok)throw new Error('خطأ '+r.status);return r.json()}).then(function(j){SHA=j.sha;D=JSON.parse(unb64(j.content))})}
function show(){$('login').hidden=true;$('panel').hidden=false;list();$('s_wa').value=D.settings.wa;$('s_bio').value=D.settings.bio;$('s_q').value=D.settings.quote}
function enter(){load().then(show).catch(function(e){$('login').hidden=false;$('panel').hidden=true;toast(e.message,1)})}
$('go').onclick=function(){
 C={token:$('tk').value.trim(),owner:$('ow').value.trim(),repo:$('rp').value.trim(),branch:$('br').value.trim()||'main'};
 if(!C.token||!C.owner||!C.repo){toast('أكمل كل الحقول');return}
 localStorage.setItem('gh',JSON.stringify(C));enter()};
$('out').onclick=function(){localStorage.removeItem('gh');location.reload()};
if(C.token){enter()}else{$('ow').value=C.owner||'';$('rp').value=C.repo||''}
function saveJson(msg){
 if(busy)return Promise.reject();busy=true;toast('جارٍ الحفظ...');
 return api('works.json','PUT',{message:msg,content:b64(JSON.stringify(D,null,2)),sha:SHA,branch:C.branch}).then(function(r){
  if(r.status===409||r.status===422){throw new Error('الملف اتغير من مكان تاني، سيتم تحميل آخر نسخة. أعد المحاولة.')}
  if(!r.ok)throw new Error('تعذر الحفظ ('+r.status+')');return r.json()}).then(function(j){SHA=j.content.sha;busy=false;toast('تم الحفظ، الموقع هيتحدث خلال دقيقة',1);list()})
 .catch(function(e){busy=false;toast(e.message||'فشل الحفظ',1);load().then(list)})}
function list(){$('list').innerHTML=D.works.map(function(w){return '<div class="row"><div>'+(w.cover?'<img src="'+esc(w.cover)+'" alt="">':'')+'<span>'+esc(w.title)+'</span></div><div><button class="ib" data-e="'+w.id+'">تعديل</button><button class="ib" data-d="'+w.id+'">حذف</button></div></div>'}).join('')||'<small>لا توجد أعمال بعد.</small>'}
function find(id){return D.works.filter(function(w){return w.id===id})[0]}
function setCover(u,pv){cover=u||'';$('prev').style.display=u?'block':'none';if(u)$('prev').src=pv||u;$('rmc').hidden=!u}
function setPdf(u){pdf=u||'';$('pdfcur').innerHTML=u?'<small>الملف الحالي: '+esc(u)+'</small>':'';$('rmp').hidden=!u}
function form(on,w){$('wf').hidden=!on;if(!on)return;editing=w?w.id:null;
 $('f_type').value=w?w.type:'novel';$('f_title').value=w?w.title:'';$('f_desc').value=w?w.desc:'';$('f_ex').value=w?w.excerpt:'';$('f_price').value=w?w.price:'';$('f_st').value=w?w.status:'on';$('f_file').value='';setCover(w?w.cover:'');$('f_pdf').value='';setPdf(w?w.pdf:'');$('wf').scrollIntoView({behavior:'smooth'})}
$('add').onclick=function(){form(true)};
$('list').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.e){form(true,find(b.dataset.e))}
 else if(b.dataset.d){if(pend===b.dataset.d){D.works=D.works.filter(function(w){return w.id!==pend});pend=null;saveJson('حذف عمل')}else{pend=b.dataset.d;toast('اضغط حذف مرة أخرى للتأكيد')}}};
$('rmc').onclick=function(){setCover('')};
$('rmp').onclick=function(){setPdf('')};
$('f_file').onchange=function(){var f=this.files[0];if(!f)return;up++;toast('جارٍ تجهيز ورفع الصورة...');
 var img=new Image(),u=URL.createObjectURL(f);
 img.onload=function(){var m=900,k=Math.min(1,m/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  var d=c.toDataURL('image/jpeg',.85),p='images/c'+Date.now().toString(36)+'.jpg';
  api(p,'PUT',{message:'رفع غلاف',content:d.split(',')[1],branch:C.branch}).then(function(r){if(!r.ok)throw 0;up--;setCover(p,d);toast('تم رفع الغلاف')}).catch(function(){up--;toast('تعذر رفع الصورة',1)})};
 img.src=u};
$('f_pdf').onchange=function(){var f=this.files[0];if(!f)return;up++;toast('جارٍ رفع ملف PDF...');
 var rd=new FileReader();
 rd.onload=function(){var d=rd.result,p='pdfs/p'+Date.now().toString(36)+'.pdf';
  api(p,'PUT',{message:'رفع PDF',content:d.split(',')[1],branch:C.branch}).then(function(r){if(!r.ok)throw 0;up--;setPdf(p);toast('تم رفع ملف PDF')}).catch(function(){up--;toast('تعذر رفع ملف PDF',1)})};
 rd.readAsDataURL(f)};
$('wf').onsubmit=function(e){e.preventDefault();if(up>0){toast('استنى لحد ما رفع الملف يخلص');return}
 var w={id:editing||'w'+Date.now().toString(36),type:$('f_type').value,title:$('f_title').value.trim(),desc:$('f_desc').value.trim(),excerpt:$('f_ex').value.trim(),price:$('f_price').value.trim(),status:$('f_st').value,cover:cover,pdf:pdf};
 if(editing){D.works=D.works.map(function(x){return x.id===editing?w:x})}else{D.works.unshift(w)}
 saveJson('تحديث الأعمال').then(function(){form(false)}).catch(function(){})};
$('sf').onsubmit=function(e){e.preventDefault();
 D.settings.wa=$('s_wa').value.replace(/\D/g,'').replace(/^00/,'');D.settings.bio=$('s_bio').value.trim();D.settings.quote=$('s_q').value.trim();saveJson('تحديث الإعدادات').catch(function(){})};
</script>
</body>
</html>
